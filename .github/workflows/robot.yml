name: Robot recolector LotoAnalytics

on:
  schedule:
    - cron: '*/10 11-23,0-2 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Instalar librerías necesarias
        run: |
          npm init -y
          npm install axios cheerio jsdom express dotenv node-cron @supabase/supabase-js ws puppeteer

      - name: Ejecutar backend-todo-en-uno
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node "backend-todo-en-uno (1).js"

      - name: Subir HTML de depuración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug-html/
          if-no-files-found: ignore
