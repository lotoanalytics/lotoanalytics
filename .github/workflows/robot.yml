name: Robot recolector LotoAnalytics

# ─────────────────────────────────────────────────────────────────────────
# CRONOGRAMA: cada bloque dispara el robot en la hora exacta de un sorteo
# (o de un grupo de sorteos que salen a la misma hora) y luego 3 veces más
# cada 3 minutos (hora, +3, +6, +9) para no perder el resultado si la fuente
# tarda unos minutos en publicarlo.
#
# Todas las horas están en UTC. República Dominicana es UTC-4 todo el año
# (no tiene horario de verano), así que cada hora local = hora UTC - 4.
# Los sorteos de Nueva York que cambian con el horario de verano de EE. UU.
# tienen DOS bloques (uno para cada horario) para cubrir todo el año.
#
# NOTA IMPORTANTE SOBRE LOS MINUTOS: GitHub documenta que los workflows
# programados pueden atrasarse varios minutos durante períodos de carga alta
# — y esos picos de carga ocurren justo en los minutos "redondos" (:00 y
# :30), porque es donde TODO EL MUNDO programa sus tareas. Por eso, todos los
# disparadores de abajo están corridos +1 minuto respecto a la hora exacta
# del sorteo (ej. 10:00am real -> dispara a las 10:01) — para esquivar el
# peor de los atascos sin perder precisión real (1 minuto es insignificante
# comparado con los 5-30 minutos de atraso que causa disparar justo en :00).
#
# Sorteos cubiertos y su hora local (RD):
#   10:00 AM  Anguila 10:00 AM
#   11:00 AM  Anguila 11:00 AM
#   12:00 PM  Anguila 12:00 PM · La Primera Día · El Quinielón Día · LoteDom (Quiniela/Quemaito/Agarra4/Súper Palé)
#   12:30 PM  La Suerte Día · King Lottery Día
#   12:55 PM  Lotería Real: Quiniela · Pega 4 Real · Loto Pool · Tu Fecha Real · Loto Real (mar/vie)
#    1:00 PM  Anguila 1:00 PM
#    1:30 PM  Florida Día
#    2:00 PM  Anguila 2:00 PM
#    2:30 PM  Nacional: Gana Más + Juega/Pega+ · New York Tarde (horario normal)
#    3:00 PM  Anguila 3:00 PM
#    3:55 PM  New York Tarde (horario de verano EE. UU.) · Leidsa completo (domingo)
#    4:00 PM  Anguila 4:00 PM
#    5:00 PM  Anguila 5:00 PM
#    6:00 PM  Anguila 6:00 PM · La Suerte Noche · Nacional Quiniela Noche (domingo)
#    7:00 PM  Anguila 7:00 PM · La Primera Noche · El Quinielón Noche · Loto 5
#    7:30 PM  King Lottery Noche
#    7:55 PM  Loteka (Quiniela/Mega Chances/Toca 3/Mega Lotto) · Real noche (Loto Pool Noche/Chance Real/Repartidera Real/Nueva Yol Real)
#    8:00 PM  Anguila 8:00 PM · La Primera Noche (reintento — se publica seguido cerca de las 8pm)
#    8:55 PM  Leidsa completo (lunes a sábado)
#    9:00 PM  Anguila 9:00 PM · Nacional Quiniela Noche (lunes a sábado) · Real Súper Palé
#    9:30 PM  Florida Noche (horario normal)
#   10:00 PM  Anguila 10:00 PM
#   10:30 PM  New York Noche (horario normal) · Florida Noche (horario de verano)
#   11:30 PM  New York Noche (horario de verano EE. UU.)
# ─────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # ---- Bloques diarios (todos los días) ----
    - cron: '1,4,7,10 14 * * *'                    # 10:00 AM Anguila
    - cron: '1,4,7,10 15 * * *'                    # 11:00 AM Anguila
    - cron: '1,4,7,10,31,34,37,40,56,59 16 * * *'  # 12:00pm Anguila/LaPrimeraDía/Quinielón/LoteDom · 12:30pm Suerte/King Día · 12:55pm Real
    - cron: '1,2,4,5,7,10,31,34,37,40 17 * * *'    # 1:00pm Anguila · 1:00-1:04 Real (cola de 12:55) · 1:30pm Florida Día
    - cron: '1,4,7,10,31,34,37,40 18 * * *'        # 2:00pm Anguila · 2:30pm Nacional Gana Más / NY Tarde normal
    - cron: '1,4,7,10,56,59 19 * * *'              # 3:00pm Anguila · 3:55pm NY Tarde verano
    - cron: '1,2,4,5,7,10,31,34,37,40 20 * * *'    # 4:00pm Anguila · cola NY Tarde verano
    - cron: '1,4,7,10,31,34,37,40 21 * * *'        # 5:00pm Anguila
    - cron: '1,4,7,10 22 * * *'                    # 6:00pm Anguila / La Suerte Noche
    - cron: '1,4,7,10,56,59 23 * * *'              # 7:00pm Anguila/LaPrimeraNoche/Quinielón/Loto5 · 7:30pm King Noche · 7:55pm Loteka/Real noche
    - cron: '1,2,4,5,7,10 0 * * *'                 # 8:00pm Anguila/LaPrimeraNoche retry · cola Loteka/Real
    - cron: '1,4,7,10,31,34,37,40 1 * * *'         # 9:00pm Anguila/Nacional Noche/Real Súper Palé · 9:30pm Florida Noche normal
    - cron: '1,4,7,10,31,34,37,40 2 * * *'         # 10:00pm Anguila · 10:30pm NY Noche normal / Florida Noche verano
    - cron: '31,34,37,40 3 * * *'                 # 11:30pm NY Noche verano

    # ---- Excepciones de horario (Leidsa: lunes a sábado 8:55pm, domingo 3:55pm) ----
    - cron: '56,59 0 * * 1-6'                     # 8:55pm Leidsa (lun-sáb)
    - cron: '1,2,4,5,7,10 1 * * 1-6'               # cola 8:55-8:59pm Leidsa (lun-sáb)

  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Instalar librerías necesarias
        run: |
          npm init -y
          npm install axios cheerio jsdom express dotenv node-cron @supabase/supabase-js ws puppeteer

      - name: Ejecutar backend-todo-en-uno
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node "backend-todo-en-uno (1).js"

      - name: Subir HTML de depuración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug-html/
          if-no-files-found: ignore
