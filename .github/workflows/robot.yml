name: Robot recolector LotoAnalytics

# ─────────────────────────────────────────────────────────────────────────
# ESTE WORKFLOW YA NO SE DISPARA SOLO POR HORARIO (schedule) — se quitó
# porque GitHub a veces atrasa o directamente no dispara los cron
# programados. Ahora el robot se manda a correr manualmente: desde
# cron-job.org (llamando a la API de GitHub, workflow_dispatch) o a mano
# desde la pestaña Actions. Sin importar quién lo mande a correr, el propio
# robot (dentro de backend-todo-en-uno.js) ya sabe ordenar los juegos por
# urgencia y revisa primero el que le tocó sortear más recientemente — así
# que no hace falta que GitHub sepa la hora de cada lotería, esa lógica ya
# vive en el código, no en este archivo.
#
# Referencia de horas (RD) por si hace falta programar los disparadores
# externos en cron-job.org:
#   10:00 AM  Anguila 10:00 AM
#   11:00 AM  Anguila 11:00 AM
#   12:00 PM  Anguila 12:00 PM · La Primera Día · El Quinielón Día · LoteDom (Quiniela/Quemaito/Agarra4/Súper Palé)
#   12:30 PM  La Suerte Día · King Lottery Día
#   12:55 PM  Lotería Real: Quiniela · Pega 4 Real · Loto Pool · Tu Fecha Real · Loto Real (mar/vie)
#    1:00 PM  Anguila 1:00 PM
#    1:30 PM  Florida Día
#    2:00 PM  Anguila 2:00 PM
#    2:30 PM  Nacional: Gana Más + Juega/Pega+ · New York Tarde (horario normal)
#    3:00 PM  Anguila 3:00 PM
#    3:55 PM  New York Tarde (horario de verano EE. UU.) · Leidsa completo (domingo)
#    4:00 PM  Anguila 4:00 PM
#    5:00 PM  Anguila 5:00 PM
#    6:00 PM  Anguila 6:00 PM · La Suerte Noche · Nacional Quiniela Noche (domingo)
#    7:00 PM  Anguila 7:00 PM · La Primera Noche · El Quinielón Noche · Loto 5
#    7:30 PM  King Lottery Noche
#    7:55 PM  Loteka (Quiniela/Mega Chances/Toca 3/Mega Lotto) · Real noche (Loto Pool Noche/Chance Real/Repartidera Real/Nueva Yol Real)
#    8:00 PM  Anguila 8:00 PM · La Primera Noche (reintento — se publica seguido cerca de las 8pm)
#    8:55 PM  Leidsa completo (lunes a sábado)
#    9:00 PM  Anguila 9:00 PM · Nacional Quiniela Noche (lunes a sábado) · Real Súper Palé
#    9:30 PM  Florida Noche (horario normal)
#   10:00 PM  Anguila 10:00 PM
#   10:30 PM  New York Noche (horario normal) · Florida Noche (horario de verano)
#   11:30 PM  New York Noche (horario de verano EE. UU.)
# ─────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Instalar librerías necesarias
        run: |
          npm init -y
          npm install axios cheerio jsdom express dotenv node-cron @supabase/supabase-js ws puppeteer

      - name: Ejecutar backend-todo-en-uno
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node "backend-todo-en-uno (1).js"

      - name: Subir HTML de depuración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug-html/
          if-no-files-found: ignore
